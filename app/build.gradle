plugins {
    id 'com.android.application'
}

android {
    namespace 'org.aemulwin'
    compileSdk 35

    defaultConfig {
        applicationId 'org.aemulwin'
        minSdk 28
        targetSdk 35
        versionCode (project.findProperty('aemulwinVersionCode')?.toString()?.toInteger() ?: 4)
        versionName (project.findProperty('aemulwinVersionName')?.toString() ?: rootProject.file('VERSION.txt').text.trim())
    }

    // Consistent signing is mandatory for in-app updates. Secrets are supplied
    // only by GitHub Actions secure repository secrets, never stored in git.
    signingConfigs {
        production {
            def encoded = System.getenv('AEMULWIN_KEYSTORE_B64')
            if (encoded) {
                def keyFile = file("$buildDir/secure-signing/aemulwin-release.keystore")
                keyFile.parentFile.mkdirs()
                keyFile.bytes = java.util.Base64.getDecoder().decode(encoded)
                storeFile keyFile
                storePassword System.getenv('AEMULWIN_STORE_PASSWORD')
                keyAlias System.getenv('AEMULWIN_KEY_ALIAS')
                keyPassword System.getenv('AEMULWIN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv('AEMULWIN_KEYSTORE_B64')) {
                signingConfig signingConfigs.production
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
