plugins {
    id 'com.android.application'
}

android {
    namespace 'org.aemulwin'
    compileSdk 35

    defaultConfig {
        applicationId 'org.aemulwin'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Release signing is intentionally not configured yet.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
