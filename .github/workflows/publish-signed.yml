name: Publish signed AEmulWin update (stable / beta)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        required: true
        default: beta
      beta_number:
        description: "Beta number (ignored for stable)"
        type: string
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Ensure a persistent signing key exists
        shell: bash
        env:
          AEMULWIN_KEYSTORE_B64: ${{ secrets.AEMULWIN_KEYSTORE_B64 }}
          AEMULWIN_STORE_PASSWORD: ${{ secrets.AEMULWIN_STORE_PASSWORD }}
          AEMULWIN_KEY_ALIAS: ${{ secrets.AEMULWIN_KEY_ALIAS }}
          AEMULWIN_KEY_PASSWORD: ${{ secrets.AEMULWIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AEMULWIN_KEYSTORE_B64 AEMULWIN_STORE_PASSWORD AEMULWIN_KEY_ALIAS AEMULWIN_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret $name. Refusing to publish non-upgradable APK."
              exit 1
            fi
          done
          echo "Persistent signing secrets are configured (contents not printed)."
      - name: Compile signed release APK
        shell: bash
        env:
          AEMULWIN_KEYSTORE_B64: ${{ secrets.AEMULWIN_KEYSTORE_B64 }}
          AEMULWIN_STORE_PASSWORD: ${{ secrets.AEMULWIN_STORE_PASSWORD }}
          AEMULWIN_KEY_ALIAS: ${{ secrets.AEMULWIN_KEY_ALIAS }}
          AEMULWIN_KEY_PASSWORD: ${{ secrets.AEMULWIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          gradle :app:assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -n 8
      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^ *versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Gradle versionName: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          PRERELEASE=()
          if [[ "$CHANNEL" == "beta" ]]; then
            if [[ ! "$BETA_NUMBER" =~ ^[1-9][0-9]{0,2}$ ]]; then
              echo "::error::Invalid beta number"
              exit 1
            fi
            TAG="-beta.$BETA_NUMBER"
            TAG="v${VERSION}${TAG}"
            PRERELEASE+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag already published. Do not overwrite signed APKs."
            exit 1
          fi
          NAME="AEmulWin-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          gh release create "$TAG" "$NAME" "$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" "${PRERELEASE[@]}" \
            --title "AEmulWin $TAG (signed APK)" \
            --notes "Official signed AEmulWin Android APK. Updates available in app: Settings > Updates. PackageInstaller requires user approval. Stable signing private key is retained only in GitHub Actions secrets, not in this repository. Never uninstall other applications."
