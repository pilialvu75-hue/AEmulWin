name: Android P0 smoke APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true
      - name: Compile minimal standalone Android app
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager not found under $SDK_ROOT"
            exit 1
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Validate languages and remote control defaults
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/org/aemulwin/MainActivity.java
          GATE=app/src/main/java/org/aemulwin/RemoteAccessGate.java
          MANIFEST=app/src/main/AndroidManifest.xml
          grep -Fq 'LANGUAGE_NAMES = {"English", "Italiano", "Français"}' "$MAIN"
          grep -Fq 'putString(PREF_LANGUAGE, LANGUAGE_CODES[position])' "$MAIN"
          grep -Fq 'connect.setEnabled(false)' "$MAIN"
          grep -Fq 'remoteAccess.stop()' "$MAIN"
          grep -Fq 'return false; // No authenticated relay/connector exists in P0.' "$GATE"
          grep -Fq 'android.permission.INTERNET' "$MANIFEST"
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"
          grep -Fq 'GuestNetworkPolicy.isGuestNetworkAllowed(this)' "$MAIN"
          grep -Fq 'connect.setEnabled(false)' "$MAIN"
          grep -Fq 'getBoolean(GUEST_NETWORK, false)' app/src/main/java/org/aemulwin/GuestNetworkPolicy.java
          # Only the official-release updater is allowed to perform HTTPS requests.
          if grep -R -E 'java[.]net[.]Socket|ServerSocket|OkHttpClient|WebSocket|android[.]webkit[.]WebView' app/src/main/java; then
            echo '::error::Unexpected network transport'
            exit 1
          fi
          if grep -R -n -E 'HttpURLConnection|openConnection[(]' app/src/main/java | grep -v 'UpdateClient.java:'; then
            echo '::error::Network outside official updater'
            exit 1
          fi
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -Fq 'android:exported="false"' "$MANIFEST"
          grep -Fq 'class UpdateActivity' app/src/main/java/org/aemulwin/UpdateActivity.java
          grep -Fq 'getPackageArchiveInfo' app/src/main/java/org/aemulwin/UpdateClient.java
          echo 'Three-language menu, guest network control, explicit updater and remote-off safeguards: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: AEmulWin-P0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish directly downloadable Android P0.3 test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.3.0-test
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelase $TAG already exists; leaving it unchanged."
            exit 0
          fi
          cp "$APK" AEmulWin-0.3.0-test.apk
          sha256sum AEmulWin-0.3.0-test.apk > AEmulWin-0.3.0-test.sha256
          gh release create "$TAG" AEmulWin-0.3.0-test.apk AEmulWin-0.3.0-test.sha256             --repo "$GITHUB_REPOSITORY" --prerelease             --title "AEmulWin 0.3.0 — first S24 test (diagnostics only)"             --notes "Standalone Android test APK with EN/IT/FR, device diagnostics, guest Internet preference and remote session disabled. It DOES NOT run Windows programs yet. Debug signing may differ from previous CI builds: do not attempt to update another app. No changes to Ai-orchestrator-riserva or WEmulDroid."
