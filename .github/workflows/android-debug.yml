name: Android P0 smoke APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true
      - name: Compile minimal standalone Android app
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager not found under $SDK_ROOT"
            exit 1
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Validate languages and remote control defaults
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/org/aemulwin/MainActivity.java
          GATE=app/src/main/java/org/aemulwin/RemoteAccessGate.java
          MANIFEST=app/src/main/AndroidManifest.xml
          grep -Fq 'LANGUAGE_NAMES = {"English", "Italiano", "Français"}' "$MAIN"
          grep -Fq 'putString(PREF_LANGUAGE, LANGUAGE_CODES[position])' "$MAIN"
          grep -Fq 'connect.setEnabled(false)' "$MAIN"
          grep -Fq 'remoteAccess.stop()' "$MAIN"
          grep -Fq 'return false; // No authenticated relay/connector exists in P0.' "$GATE"
          if grep -Fq 'android.permission.INTERNET' "$MANIFEST"; then
            echo '::error::P0.2 may not request INTERNET permission'
            exit 1
          fi
          echo 'Three-language menu and offline remote access default: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: AEmulWin-P0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
